plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hardwire.blob'
    compileSdk 34

    defaultConfig {
        applicationId "com.hardwire.blob"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.3.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['../core/src/main/resources']
            }
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':compat-layer')
}
